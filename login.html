<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniSync</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
}
</script>
<style>
/* Theme Variables & Background Grids */
:root {
  --bg-main: #f8fafc;
  --text-main: #0f172a;
  --grid-line: rgba(0, 0, 0, 0.05);
  --spotlight: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0.03) 40%, transparent 70%);
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-border: rgba(0, 0, 0, 0.08);
  --box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
  --box-dot: #0f172a;
}

.dark {
  --bg-main: #08090d;
  --text-main: #ffffff;
  --grid-line: rgba(255, 255, 255, 0.03);
  --spotlight: radial-gradient(circle at 50% 0%, rgba(120, 160, 255, 0.15) 0%, rgba(120, 160, 255, 0.05) 35%, transparent 70%);
  --card-bg: rgba(13, 15, 22, 0.85);
  --card-border: rgba(255, 255, 255, 0.08);
  --box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  --box-dot: #ffffff;
}

body {
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* Grid & Lighting Effects */
.grid-bg {
  background-size: 80px 80px;
  background-image: 
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
}

.spotlight {
  background: var(--spotlight);
  transition: background 0.3s ease;
}

/* Interactive Card Base Styling */
.auth-card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  box-shadow: var(--box-shadow);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, border-color 0.3s ease, z-index 0.1s;
}

/* Side Card Defaults (Inactive State) */
.card-left {
  transform: translateX(40px) rotate(-4deg) scale(0.9);
  opacity: 0.4;
  z-index: 10;
}

.card-center {
  transform: rotate(0deg) scale(1);
  opacity: 1;
  z-index: 20;
}

.card-right {
  transform: translateX(-40px) rotate(4deg) scale(0.9);
  opacity: 0.4;
  z-index: 10;
}

/* Hover / Focus State Animations for Interactive Form Access */
.auth-card:hover, .auth-card:focus-within {
  transform: translateY(-10px) rotate(0deg) scale(1.03) !important;
  opacity: 1 !important;
  z-index: 30 !important;
  border-color: rgba(59, 130, 246, 0.5) !important;
}

/* Bounding Box Styling */
.bounding-box {
  border: 1px dashed var(--card-border);
  position: relative;
}

.bounding-box::before, .bounding-box::after,
.bounding-box-corner-bl, .bounding-box-corner-br {
  content: '';
  position: absolute;
  width: 5px;
  height: 5px;
  background-color: var(--box-dot);
  border-radius: 50%;
}

.bounding-box::before { top: -3px; left: -3px; }
.bounding-box::after { top: -3px; right: -3px; }
.bounding-box-corner-bl { bottom: -3px; left: -3px; }
.bounding-box-corner-br { bottom: -3px; right: -3px; }
</style>
</head>
<body class="min-h-screen grid-bg relative overflow-x-hidden flex flex-col justify-between">

<div class="absolute inset-0 spotlight pointer-events-none"></div>

<header class="relative z-10 flex items-center justify-between px-8 py-6 max-w-7xl w-full mx-auto">
  <div class="flex items-center gap-2">
    <span class="font-semibold text-lg tracking-tight">PROPHECY_HACKCULT</span>
  </div>

  <div class="absolute left-1/2 transform -translate-x-1/2">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="text-current opacity-80">
      <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <button id="themeToggle" class="p-2 rounded-lg border border-gray-300 dark:border-white/10 hover:bg-gray-200 dark:hover:bg-white/5 transition-colors text-xs font-medium flex items-center gap-2">
    <span id="themeIcon">☀️ Light</span>
  </button>
</header>

<main class="relative z-10 flex flex-col items-center justify-center flex-1 text-center px-4 mt-2">
  <div class="inline-flex items-center gap-4 text-xs tracking-wider text-gray-500 dark:text-gray-400 uppercase mb-3">
    <span class="h-[1px] w-8 bg-gray-300 dark:bg-gray-700"></span>
    Introducing
    <span class="h-[1px] w-8 bg-gray-300 dark:bg-gray-700"></span>
  </div>

  <div class="bounding-box p-3 md:px-10 md:py-4 mb-4 inline-block">
    <div class="bounding-box-corner-bl"></div>
    <div class="bounding-box-corner-br"></div>
    <h1 class="text-5xl md:text-7xl font-bold tracking-tight">UNISYNC</h1>
  </div>

  <p class="text-gray-600 dark:text-gray-400 text-base md:text-lg max-w-md leading-relaxed font-normal mb-8">
    The world’s best login box,<br />
    powered by <span class="font-medium text-black dark:text-white">Prophecy_Hackcult</span>.
  </p>

  <div class="relative w-full max-w-6xl flex items-center justify-center gap-2 md:gap-6 pb-12 px-4">

    <!-- Faculty Portal -->
    <div class="w-[340px] rounded-2xl auth-card card-left p-6 text-left">
      <div class="w-7 h-7 mx-auto mb-3 rounded-full border border-black/10 dark:border-white/20 flex items-center justify-center bg-black/5 dark:bg-white/5">
        <div class="w-2.5 h-2.5 border border-black/60 dark:border-white/60 rounded-full"></div>
      </div>
      <h2 class="text-center text-sm font-medium text-gray-800 dark:text-gray-200 mb-4">Faculty Portal</h2>

      <form onsubmit="event.preventDefault(); window.location.href='home1.html';" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Faculty ID</label>
          <input type="text" placeholder="FAC-9021" required class="w-full bg-black/5 dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-lg px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Department</label>
          <input type="text" placeholder="Computer Science" required class="w-full bg-black/5 dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-lg px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" />
        </div>
        <button type="submit" class="w-full bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 text-xs font-medium py-2 rounded-lg transition-all mt-2">Sign In as Faculty</button>
      </form>
    </div>

    <!-- Admin Control Panel -->
    <div class="w-[360px] rounded-2xl auth-card card-center p-7 text-left">
      <div class="w-8 h-8 mx-auto mb-3 rounded-full border border-black/10 dark:border-white/20 flex items-center justify-center bg-black/5 dark:bg-white/5">
        <div class="w-3 h-3 border border-black/60 dark:border-white/60 rounded-full"></div>
      </div>
      <h2 class="text-center text-sm font-medium text-gray-800 dark:text-gray-200 mb-4">Admin Control Panel</h2>

      <form onsubmit="event.preventDefault(); window.location.href='home2.html';" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Admin Email</label>
          <input type="email" placeholder="admin@unisync.edu" required class="w-full bg-black/5 dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-lg px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Security Key</label>
          <input type="password" placeholder="••••••••••••" required class="w-full bg-black/5 dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-lg px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" />
        </div>
        <button type="submit" class="w-full bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 text-xs font-medium py-2 rounded-lg transition-all mt-2">Sign In as Admin</button>
      </form>
    </div>

    <!-- Student Portal -->
    <div class="w-[340px] rounded-2xl auth-card card-right p-6 text-left">
      <div class="w-7 h-7 mx-auto mb-3 rounded-full border border-black/10 dark:border-white/20 flex items-center justify-center bg-black/5 dark:bg-white/5">
        <div class="w-2.5 h-2.5 border border-black/60 dark:border-white/60 rounded-full"></div>
      </div>
      <h2 class="text-center text-sm font-medium text-gray-800 dark:text-gray-200 mb-4">Student Portal</h2>

      <form onsubmit="event.preventDefault(); login();" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Roll / Registration No.</label>
          <input id="id" type="text" placeholder="2026-CS-089" required class="w-full bg-black/5 dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-lg px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Passcode</label>
          <input id="password" type="password" placeholder="••••••••" required class="w-full bg-black/5 dark:bg-black/40 border border-black/10 dark:border-white/10 rounded-lg px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:border-blue-500 transition-colors" />
        </div>
        <button type="submit" class="w-full bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 border border-black/10 dark:border-white/10 text-xs font-medium py-2 rounded-lg transition-all mt-2">Sign In as Student</button>
        <p id="message" class="text-xs text-center mt-2 font-medium"></p>
      </form>
    </div>

  </div>
</main>

<script>
  // Student Login Script
  async function login() {
    const id = document.getElementById("id").value;
    const password = document.getElementById("password").value;
    const messageEl = document.getElementById("message");

    messageEl.innerText = "Authenticating...";
    messageEl.className = "text-xs text-center mt-2 font-medium text-gray-400";

    try {
      const response = await fetch("http://127.0.0.1:5000/student/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: id,
          password: password
        })
      });

      const data = await response.json();

      if (response.ok && data.success === true) {
        messageEl.innerText = "Login Successful ✅";
        messageEl.className = "text-xs text-center mt-2 font-medium text-emerald-500";
        setTimeout(() => {
          window.location.href = "home3.html";
        }, 800);
      } else {
        messageEl.innerText = data.message || "Wrong ID or Password ❌";
        messageEl.className = "text-xs text-center mt-2 font-medium text-rose-500";
      }
    } catch (error) {
      messageEl.innerText = "Unable to connect to server ❌";
      messageEl.className = "text-xs text-center mt-2 font-medium text-rose-500";
    }
  }

  // Dark/Light Theme Switcher Logic
  const themeToggleBtn = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const html = document.documentElement;

  themeToggleBtn.addEventListener('click', () => {
    if (html.classList.contains('dark')) {
      html.classList.remove('dark');
      themeIcon.textContent = '🌙 Dark';
    } else {
      html.classList.add('dark');
      themeIcon.textContent = '☀️ Light';
    }
  });
</script>
</body>
</html>
